odin_relative_move_server:
  ros__parameters:
    action_name: /r2_odin_relative_move

    # IMPORTANT: Replace this with the actual Odin odometry topic.
    odom_topic: /odin1/odometry_highfreq
    cmd_vel_topic: /cmd_vel

    control_rate_hz: 30.0
    initial_odom_wait_sec: 2.0
    odom_timeout_sec: 0.30

    forward_kp: 0.8
    lateral_kp: 0.8

    min_forward_speed_mps: 0.8
    max_forward_speed_mps: 1.0

    min_lateral_speed_mps: 0.8
    max_lateral_speed_mps: 1.0

    position_tolerance_m: 0.05
    settle_time_sec: 0.25
