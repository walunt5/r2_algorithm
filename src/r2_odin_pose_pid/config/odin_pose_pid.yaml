frames:
  global_frame: map
  robot_frame: chassis_base_link

topics:
  cmd_vel: /cmd_vel

files:
  nav_goals_package: r2_nav_bringup
  nav_goals_relative_path: config/r2_nav_goals.yaml

control:
  rate_hz: 30.0
  default_timeout_sec: 8.0
  tf_timeout_sec: 0.1

strategy:
  mode: yaw_gate_xy_pid

  # yaw 小于这个值，允许从“只旋转”进入“只平移”
  yaw_enter_xy_threshold: 0.08

  # 平移过程中 yaw 大于这个值，退回“只旋转”
  yaw_exit_xy_threshold: 0.12

tolerance:
  x: 0.02
  y: 0.02
  yaw: 0.03
  stable_time_ms: 300

pid:
  x:
    kp: 0.8
    ki: 0.0
    kd: 0.03
    i_limit: 0.2

  y:
    kp: 0.8
    ki: 0.0
    kd: 0.03
    i_limit: 0.2

  yaw:
    kp: 1.2
    ki: 0.0
    kd: 0.05
    i_limit: 0.2

limits:
  max_vx: 0.20
  max_vy: 0.20
  max_wz: 0.45